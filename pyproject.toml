[project]
name = "fastapi-pillar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "bcrypt>=4.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.123.5",
    "fastapi-cli>=0.0.16",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "psycopg>=3.3.1",
    "psycopg-binary>=3.3.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "sentry-sdk>=2.47.0",
    "sqlmodel>=0.0.27",
    "uvicorn>=0.38.0",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "coverage>=7.13.0",
    "factory-boy>=3.3.3",
    "faker>=38.2.0",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]